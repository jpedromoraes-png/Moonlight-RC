<title>Moonlight Rental Car</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,500&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  /* ============================= TOKENS ============================= */
  :root{
    --ink-900:#12171d; --ink-800:#1c232b; --ink-700:#2a333d; --ink-600:#4a5568; --ink-500:#6b7686; --ink-400:#8d97a5; --ink-300:#b6bec8;
    --paper-0:#ffffff; --paper-50:#f5f6f8; --paper-100:#eceef2; --line:#e1e5eb; --line-strong:#cdd3db;
    --accent:#0e6e63; --accent-600:#0b564d; --accent-100:#e0f0ed; --accent-ink:#06332c;
    --toll:#a8671a; --toll-600:#8a5414; --toll-100:#faf0dd; --toll-ink:#4d2f0c;
    --ok:#1e8e5a; --ok-100:#e2f5ea; --ok-ink:#0f5c39;
    --info:#2563ac; --info-100:#e5eefa; --info-ink:#173e6b;
    --warn:#b7791f; --warn-100:#faf0dc; --warn-ink:#5c3f0f;
    --danger:#c43d3d; --danger-100:#fbe7e7; --danger-ink:#7a1f1f;
    --neutral:#6b7280; --neutral-100:#eef0f2; --neutral-ink:#3a3f47;
    --shadow-sm:0 1px 2px rgba(18,23,29,.06);
    --shadow-md:0 6px 20px -6px rgba(18,23,29,.16), 0 2px 6px -2px rgba(18,23,29,.08);
    --shadow-lg:0 20px 44px -12px rgba(18,23,29,.28);
    --radius-sm:8px; --radius-md:12px; --radius-lg:16px;
    --sidebar-w:252px;
    --sidebar-bg:#12171d; --sidebar-bg-2:#0c0f13;
    --font-display:'Outfit',ui-sans-serif,system-ui,sans-serif;
    --font-body:'Hanken Grotesk',ui-sans-serif,system-ui,-apple-system,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink-900:#eef1f4; --ink-800:#dde2e8; --ink-700:#c3cbd4; --ink-600:#9aa4b1; --ink-500:#7c8794; --ink-400:#67717d; --ink-300:#454e59;
      --paper-0:#171c22; --paper-50:#10141a; --paper-100:#1e242c; --line:#2a323b; --line-strong:#3a434e;
      --accent:#2fb3a1; --accent-600:#3fd0bc; --accent-100:#163430; --accent-ink:#bdf0e6;
      --toll:#d99a3d; --toll-600:#e8b05e; --toll-100:#33280f; --toll-ink:#f4dcae;
      --ok:#3ec281; --ok-100:#122f22; --ok-ink:#a8e9c6;
      --info:#5b9bdb; --info-100:#132638; --info-ink:#bcdcfa;
      --warn:#d9a33d; --warn-100:#332c11; --warn-ink:#f4e0ae;
      --danger:#e2686a; --danger-100:#361718; --danger-ink:#f8c9ca;
      --neutral:#8b93a0; --neutral-100:#242a31; --neutral-ink:#cfd4da;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --ink-900:#eef1f4; --ink-800:#dde2e8; --ink-700:#c3cbd4; --ink-600:#9aa4b1; --ink-500:#7c8794; --ink-400:#67717d; --ink-300:#454e59;
    --paper-0:#171c22; --paper-50:#10141a; --paper-100:#1e242c; --line:#2a323b; --line-strong:#3a434e;
    --accent:#2fb3a1; --accent-600:#3fd0bc; --accent-100:#163430; --accent-ink:#bdf0e6;
    --toll:#d99a3d; --toll-600:#e8b05e; --toll-100:#33280f; --toll-ink:#f4dcae;
    --ok:#3ec281; --ok-100:#122f22; --ok-ink:#a8e9c6;
    --info:#5b9bdb; --info-100:#132638; --info-ink:#bcdcfa;
    --warn:#d9a33d; --warn-100:#332c11; --warn-ink:#f4e0ae;
    --danger:#e2686a; --danger-100:#361718; --danger-ink:#f8c9ca;
    --neutral:#8b93a0; --neutral-100:#242a31; --neutral-ink:#cfd4da;
    color-scheme: dark;
  }

  *,*::before,*::after{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--paper-50); color:var(--ink-900);
    font-family:var(--font-body); font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:var(--font-display); font-weight:700; margin:0; text-wrap:balance; color:var(--ink-900);}
  p{margin:0;}
  button{font-family:inherit; font-size:inherit; color:inherit;}
  a{color:inherit;}
  ::selection{background:var(--accent-100); color:var(--accent-ink);}
  .num, .mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums; letter-spacing:-.01em;}
  button, input, select{outline-offset:2px;}
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px; border-radius:6px;
  }
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }

  /* ============================= LAYOUT ============================= */
  #app{min-height:100%;}
  .sidebar{
    position:fixed; top:0; left:0; bottom:0; width:var(--sidebar-w); background:var(--sidebar-bg);
    display:flex; flex-direction:column; z-index:40; transition:transform .22s ease;
  }
  .brand{
    display:flex; align-items:center; gap:10px; padding:20px 20px 16px; color:#fff;
  }
  .brand-mark{
    width:34px; height:34px; border-radius:9px; background:linear-gradient(160deg, var(--accent), var(--accent-600));
    display:flex; align-items:center; justify-content:center; flex:none; box-shadow:0 2px 6px rgba(0,0,0,.35);
  }
  .brand-mark svg{width:19px;height:19px;stroke:#fff;}
  .brand-text{display:flex; flex-direction:column; line-height:1.2;}
  .brand-text b{font-family:var(--font-display); font-size:15.5px; font-weight:700; color:#fff;}
  .brand-text span{font-size:11px; color:#8b96a4; letter-spacing:.02em;}
  .nav{flex:1; overflow-y:auto; padding:8px 12px;}
  .nav-section-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:#5f6a78; padding:14px 10px 6px;}
  .nav-item{
    display:flex; align-items:center; gap:11px; width:100%; padding:9px 12px; border:none; background:none;
    border-radius:9px; color:#aab3c0; cursor:pointer; font-size:13.6px; font-weight:500; margin-bottom:2px; text-align:left;
    position:relative;
  }
  .nav-item svg{width:17px;height:17px; flex:none; stroke:currentColor;}
  .nav-item:hover{background:rgba(255,255,255,.06); color:#fff;}
  .nav-item.active{background:rgba(47,179,161,.16); color:#fff;}
  .nav-item.active::before{content:"";position:absolute; left:-12px; top:8px; bottom:8px; width:3px; border-radius:0 4px 4px 0; background:var(--accent-600);}
  .nav-item .count{margin-left:auto; font-size:11px; background:rgba(255,255,255,.1); color:#cdd4dc; padding:1px 7px; border-radius:20px; font-family:var(--font-mono);}
  .nav-item.active .count{background:var(--accent-600); color:#06231e;}
  .nav-footer{padding:12px; border-top:1px solid rgba(255,255,255,.08);}
  .nav-user{display:flex; align-items:center; gap:10px; padding:8px; border-radius:10px;}
  .nav-user:hover{background:rgba(255,255,255,.06); cursor:pointer;}
  .avatar{
    width:32px; height:32px; border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center;
    justify-content:center; font-weight:700; font-size:12.5px; flex:none; font-family:var(--font-display);
  }
  .nav-user-text{display:flex; flex-direction:column; line-height:1.25; overflow:hidden;}
  .nav-user-text b{font-size:12.8px; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .nav-user-text span{font-size:11px; color:#8b96a4;}

  .main{margin-left:var(--sidebar-w); display:flex; flex-direction:column; min-height:100vh;}
  .topbar{
    position:sticky; top:0; z-index:30; background:color-mix(in srgb, var(--paper-0) 88%, transparent); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line); display:flex; align-items:center; gap:16px; padding:0 24px; height:64px;
  }
  .mobile-menu-btn{display:none;}
  .topbar-search{
    flex:1; min-width:0; max-width:420px; position:relative; display:flex; align-items:center;
  }
  .topbar-search svg{position:absolute; left:12px; width:15px; height:15px; stroke:var(--ink-400); pointer-events:none;}
  .topbar-search input{
    width:100%; min-width:0; border:1px solid var(--line); background:var(--paper-50); border-radius:9px; padding:8px 12px 8px 34px;
    font-size:13.3px; color:var(--ink-900);
  }
  .topbar-search input:focus{background:var(--paper-0); border-color:var(--accent);}
  .topbar-search input::placeholder{color:var(--ink-400);}
  .topbar-right{display:flex; align-items:center; gap:6px; margin-left:auto;}
  .topbar-date{font-size:12.6px; color:var(--ink-500); margin-right:8px; white-space:nowrap; font-family:var(--font-mono);}
  .proto-badge{display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-500); background:var(--paper-100); border:1px solid var(--line-strong); padding:4px 9px; border-radius:20px; white-space:nowrap; margin-right:4px;}
  .proto-badge::before{content:""; width:6px; height:6px; border-radius:50%; background:var(--warn); flex:none;}
  .icon-btn{
    width:36px; height:36px; border-radius:9px; border:1px solid transparent; background:none; display:flex; align-items:center;
    justify-content:center; cursor:pointer; color:var(--ink-600); position:relative;
  }
  .icon-btn svg{width:18px; height:18px; stroke:currentColor;}
  .icon-btn:hover{background:var(--paper-100); color:var(--ink-900);}
  .icon-btn .dot{position:absolute; top:6px; right:7px; width:7px; height:7px; border-radius:50%; background:var(--danger); border:1.5px solid var(--paper-0);}
  .topbar-avatar{margin-left:6px; cursor:pointer;}

  .page{padding:24px 28px 64px; max-width:1360px; width:100%; margin:0 auto;}
  .page-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:20px; flex-wrap:wrap;}
  .page-head h1{font-size:23px;}
  .page-head .sub{color:var(--ink-500); font-size:13.2px; margin-top:3px;}
  .page-actions{display:flex; gap:8px; flex-wrap:wrap;}

  /* ============================= BUTTONS ============================= */
  .btn{
    display:inline-flex; align-items:center; gap:7px; padding:8px 14px; border-radius:9px; border:1px solid var(--line-strong);
    background:var(--paper-0); color:var(--ink-800); font-weight:600; font-size:13px; cursor:pointer; white-space:nowrap;
    transition:background .12s, border-color .12s;
  }
  .btn svg{width:15px;height:15px; stroke:currentColor;}
  .btn:hover{background:var(--paper-100);}
  .btn-primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn-primary:hover{background:var(--accent-600); border-color:var(--accent-600);}
  .btn-ghost{border-color:transparent; background:none;}
  .btn-ghost:hover{background:var(--paper-100);}
  .btn-sm{padding:6px 10px; font-size:12.4px; border-radius:7px;}
  .btn-danger-ghost{color:var(--danger); border-color:var(--danger-100); background:var(--danger-100);}
  .btn-danger-ghost:hover{background:var(--danger-100); filter:brightness(.96);}
  .btn:disabled{opacity:.5; cursor:not-allowed;}

  /* ============================= CARDS / METRICS ============================= */
  .grid-metrics{display:grid; grid-template-columns:repeat(5,1fr); gap:14px; margin-bottom:18px;}
  .grid-metrics.gm-4{grid-template-columns:repeat(4,1fr);}
  .grid-metrics.gm-3{grid-template-columns:repeat(3,1fr);}
  .metric-card{
    background:var(--paper-0); border:1px solid var(--line); border-radius:var(--radius-md); padding:16px 16px 14px;
    display:flex; flex-direction:column; gap:8px; box-shadow:var(--shadow-sm);
  }
  .metric-top{display:flex; align-items:center; justify-content:space-between;}
  .metric-label{font-size:12px; font-weight:600; color:var(--ink-500); text-transform:uppercase; letter-spacing:.03em;}
  .metric-icon{width:28px; height:28px; border-radius:8px; display:flex; align-items:center; justify-content:center; flex:none;}
  .metric-icon svg{width:15px;height:15px;stroke:currentColor;}
  .metric-value{font-family:var(--font-display); font-size:26px; font-weight:700; letter-spacing:-.01em;}
  .metric-foot{font-size:12px; color:var(--ink-500); display:flex; align-items:center; gap:5px;}
  .metric-foot b{color:var(--ink-700); font-weight:600;}
  .metric-card.accent-ok .metric-icon{background:var(--ok-100); color:var(--ok-ink);}
  .metric-card.accent-info .metric-icon{background:var(--info-100); color:var(--info-ink);}
  .metric-card.accent-warn .metric-icon{background:var(--warn-100); color:var(--warn-ink);}
  .metric-card.accent-danger .metric-icon{background:var(--danger-100); color:var(--danger-ink);}
  .metric-card.accent-toll .metric-icon{background:var(--toll-100); color:var(--toll-ink);}
  .metric-card.accent-accent .metric-icon{background:var(--accent-100); color:var(--accent-ink);}

  .panel{background:var(--paper-0); border:1px solid var(--line); border-radius:var(--radius-md); box-shadow:var(--shadow-sm);}
  .panel-head{display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border-bottom:1px solid var(--line); gap:10px;}
  .panel-head h3{font-size:15px;}
  .panel-head .link{font-size:12.6px; font-weight:600; color:var(--accent); cursor:pointer; background:none; border:none; display:flex; align-items:center; gap:4px;}
  .panel-body{padding:8px 8px;}
  .panel-body.pad{padding:16px 18px;}

  .row-2col{display:grid; grid-template-columns:1.3fr 1fr; gap:14px; align-items:start; margin-bottom:14px;}
  .row-2col.even{grid-template-columns:1fr 1fr;}

  .activity-item{display:flex; align-items:center; gap:12px; padding:10px 10px; border-radius:10px;}
  .activity-item:hover{background:var(--paper-50);}
  .activity-thumb{width:38px; height:38px; border-radius:9px; background:var(--paper-100); display:flex; align-items:center; justify-content:center; flex:none; color:var(--ink-500);}
  .activity-thumb svg{width:17px;height:17px; stroke:currentColor;}
  .activity-thumb.pickup{background:var(--info-100); color:var(--info-ink);}
  .activity-thumb.return{background:var(--ok-100); color:var(--ok-ink);}
  .activity-thumb.resv{background:var(--warn-100); color:var(--warn-ink);}
  .activity-text{flex:1; min-width:0;}
  .activity-text b{font-size:13.2px; font-weight:600; display:block;}
  .activity-text span{font-size:12.2px; color:var(--ink-500); display:block; margin-top:1px;}
  .activity-time{font-size:12px; font-weight:600; color:var(--ink-700); text-align:right; white-space:nowrap; font-family:var(--font-mono);}
  .activity-time small{display:block; font-weight:500; color:var(--ink-400); font-size:10.5px; font-family:var(--font-body);}
  .empty-mini{padding:26px 10px; text-align:center; color:var(--ink-400); font-size:12.8px;}

  .alert-item{display:flex; align-items:flex-start; gap:11px; padding:11px 10px; border-radius:10px;}
  .alert-item:hover{background:var(--paper-50);}
  .alert-dot{width:30px;height:30px;border-radius:8px; display:flex; align-items:center; justify-content:center; flex:none; margin-top:1px;}
  .alert-dot svg{width:15px;height:15px;stroke:currentColor;}
  .alert-dot.danger{background:var(--danger-100); color:var(--danger-ink);}
  .alert-dot.warn{background:var(--warn-100); color:var(--warn-ink);}
  .alert-dot.toll{background:var(--toll-100); color:var(--toll-ink);}
  .alert-text b{font-size:13px; font-weight:600; display:block;}
  .alert-text span{font-size:12.1px; color:var(--ink-500);}

  /* ============================= FILTER BAR ============================= */
  .filter-bar{display:flex; gap:8px; flex-wrap:wrap; align-items:center; padding:14px 18px; border-bottom:1px solid var(--line);}
  .filter-bar .search-mini{position:relative; flex:1; min-width:180px; max-width:280px;}
  .filter-bar .search-mini svg{position:absolute; left:10px; top:50%; transform:translateY(-50%); width:14px; height:14px; stroke:var(--ink-400);}
  .filter-bar .search-mini input{width:100%; padding:7px 10px 7px 30px; border:1px solid var(--line); border-radius:8px; background:var(--paper-50); font-size:12.8px;}
  .filter-bar select{
    padding:7px 26px 7px 10px; border:1px solid var(--line); border-radius:8px; background:var(--paper-50) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="%236b7686" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>') no-repeat right 8px center;
    font-size:12.6px; color:var(--ink-700); appearance:none; cursor:pointer;
  }
  .filter-count{margin-left:auto; font-size:12px; color:var(--ink-500);}
  .filter-bar .clear-btn{font-size:12px; color:var(--accent); font-weight:600; background:none; border:none; cursor:pointer;}
  .view-toggle{display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden;}
  .view-toggle button{padding:6px 10px; background:var(--paper-0); border:none; cursor:pointer; display:flex; color:var(--ink-500);}
  .view-toggle button svg{width:14px;height:14px; stroke:currentColor;}
  .view-toggle button.active{background:var(--accent-100); color:var(--accent-ink);}
  .view-toggle button+button{border-left:1px solid var(--line);}

  /* ============================= TABLE ============================= */
  .table-wrap{overflow-x:auto;}
  table{width:100%; border-collapse:collapse; min-width:640px;}
  thead th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-500); font-weight:600;
    padding:10px 16px; border-bottom:1px solid var(--line); white-space:nowrap; background:var(--paper-0); position:sticky; top:0;
  }
  tbody td{padding:12px 16px; border-bottom:1px solid var(--line); font-size:13.2px; vertical-align:middle;}
  tbody tr{cursor:pointer; transition:background .1s;}
  tbody tr:hover{background:var(--paper-50);}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr.static{cursor:default;}
  td.num, th.num{text-align:right; font-family:var(--font-mono);}
  .cell-main{display:flex; align-items:center; gap:10px;}
  .cell-main b{font-weight:600; font-size:13.2px; display:block;}
  .cell-main span{font-size:12px; color:var(--ink-500);}
  .cell-avatar{width:30px;height:30px; border-radius:50%; background:var(--paper-100); color:var(--ink-600); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:11px; flex:none; font-family:var(--font-display);}
  .veh-thumb{width:44px; height:32px; border-radius:7px; background:var(--paper-100); display:flex; align-items:center; justify-content:center; flex:none; color:var(--ink-400);}
  .veh-thumb svg{width:20px;height:20px; stroke:currentColor;}
  .plate{font-family:var(--font-mono); font-size:11.5px; background:var(--paper-100); border:1px solid var(--line-strong); padding:1.5px 6px; border-radius:4px; letter-spacing:.03em; color:var(--ink-700); display:inline-block;}

  /* ============================= BADGES ============================= */
  .badge{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; padding:3px 9px 3px 7px; border-radius:20px; white-space:nowrap; line-height:1.5;}
  .badge::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor; flex:none;}
  .badge-ok{background:var(--ok-100); color:var(--ok-ink);}
  .badge-info{background:var(--info-100); color:var(--info-ink);}
  .badge-warn{background:var(--warn-100); color:var(--warn-ink);}
  .badge-danger{background:var(--danger-100); color:var(--danger-ink);}
  .badge-neutral{background:var(--neutral-100); color:var(--neutral-ink);}
  .badge-toll{background:var(--toll-100); color:var(--toll-ink);}
  .badge-accent{background:var(--accent-100); color:var(--accent-ink);}

  /* ============================= FLEET GRID ============================= */
  .fleet-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(272px,1fr)); gap:14px; padding:16px 18px;}
  .veh-card{border:1px solid var(--line); border-radius:var(--radius-md); overflow:hidden; cursor:pointer; background:var(--paper-0); transition:box-shadow .15s, transform .15s;}
  .veh-card:hover{box-shadow:var(--shadow-md); transform:translateY(-2px);}
  .veh-photo{height:112px; background:linear-gradient(135deg, var(--paper-100), var(--paper-50)); display:flex; align-items:center; justify-content:center; color:var(--ink-300); position:relative; overflow:hidden;}
  .veh-photo svg{width:56px; height:56px; stroke:currentColor; stroke-width:1.15; position:relative; z-index:1;}
  .veh-photo::before{content:""; position:absolute; inset:0; opacity:.5; background-image:radial-gradient(circle at 18% 22%, currentColor 0, transparent 42%), radial-gradient(circle at 82% 78%, currentColor 0, transparent 38%); opacity:.10;}
  .veh-photo .badge{position:absolute; top:10px; right:10px; z-index:1;}
  .veh-photo.tone-ok{background:linear-gradient(135deg, var(--ok-100), var(--paper-0)); color:var(--ok-ink);}
  .veh-photo.tone-info{background:linear-gradient(135deg, var(--info-100), var(--paper-0)); color:var(--info-ink);}
  .veh-photo.tone-warn{background:linear-gradient(135deg, var(--warn-100), var(--paper-0)); color:var(--warn-ink);}

const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function parseISO(iso){ const [y,m,d] = iso.split('-').map(Number); return new Date(y, m-1, d); }
function fmtDate(iso){ if(!iso) return '—'; const d = parseISO(iso); return `${MONTHS[d.getMonth()]} ${String(d.getDate()).padStart(2,'0')}, ${d.getFullYear()}`; }
function fmtDateShort(iso){ if(!iso) return '—'; const d = parseISO(iso); return `${MONTHS[d.getMonth()]} ${String(d.getDate()).padStart(2,'0')}`; }
function fmtMoney(n){ if(n==null) return '—'; const neg = n<0; n=Math.abs(n); const s = n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); return (neg?'-':'')+'$'+s; }
function fmtMoneyShort(n){ if(n==null) return '—'; if(Math.abs(n)>=1000) return '$'+(n/1000).toFixed(1).replace(/\.0$/,'')+'k'; return fmtMoney(n); }
function daysBetween(a,b){ return Math.round((parseISO(b)-parseISO(a))/86400000); }
function daysFromToday(iso){ return Math.round((parseISO(iso)-TODAY)/86400000); }
function initials(name){ return name.split(' ').filter(Boolean).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

const STATUS_CLASS = {
  Available:'ok', Rented:'info', Reserved:'warn', Maintenance:'danger',

  Paid:'ok', Overdue:'danger', Refunded:'neutral', Charged:'info', Disputed:'danger',
  'Due Soon':'warn', Inactive:'neutral',
};
function badge(status, label){
  const cls = STATUS_CLASS[status] || 'neutral';
  return `<span class="badge badge-${cls}">${esc(label||status)}</span>`;
}

function vehicleLabel(v){ return `${v.make} ${v.model} ${v.year}`; }
function vehicleById(id){ return api.getVehicle(id); }
function customerById(id){ return api.getCustomer(id); }

function rentalTotal(r){
  const days = Math.max(1, daysBetween(r.pickup, r.dropoff));
  return days * r.dailyRate + (r.extras||0) + (r.sunpass||0);
}
function rentalDays(r){ return Math.max(1, daysBetween(r.pickup, r.dropoff)); }

  return DATA.rentals.filter(r=>r.customer===cid && r.status!=='Cancelled').reduce((s,r)=>s+rentalTotal(r),0);
}

<script>
/* =========================================================================
   NAVIGATION / APP SHELL
   ========================================================================= */
const NAV_ITEMS = [
  {id:'dashboard', label:'Dashboard', icon:'dashboard'},
  {id:'fleet', label:'Fleet', icon:'fleet'},
  {id:'rentals', label:'Rentals', icon:'rentals'},
  {id:'reservations', label:'Reservations', icon:'reservations'},
  {id:'customers', label:'Customers', icon:'customers'},
  {id:'sunpass', label:'SunPass', icon:'sunpass'},
  {id:'payments', label:'Payments', icon:'payments'},
  {id:'maintenance', label:'Maintenance', icon:'maintenance'},
];
const BOTTOM_NAV_IDS = ['dashboard','fleet','rentals','sunpass'];

function navCounts(){
  return {
    dashboard:null,
    fleet: DATA.vehicles.length,
    rentals: DATA.rentals.filter(r=>r.status==='Active'||r.status==='Late').length,
    reservations: DATA.reservations.filter(r=>r.status==='Pending'||r.status==='Confirmed').length,
    customers: DATA.customers.length,
    sunpass: DATA.sunpass.filter(t=>t.status==='Pending').length,
    payments: DATA.payments.filter(p=>p.status==='Pending'||p.status==='Overdue').length,
    maintenance: DATA.maintenance.filter(m=>m.status==='Overdue'||m.status==='Due Soon').length,
  };
}

const state = { page:'dashboard', drawer:null, modal:null, filters:{}, fleetView:'grid', theme:'system' };

function renderNav(){
  const counts = navCounts();
  document.getElementById('nav').innerHTML = NAV_ITEMS.map(item => {
    const active = state.page === item.id;
    const count = counts[item.id];
    return `<button class="nav-item ${active?'active':''}" data-page="${item.id}" onclick="navigate('${item.id}')">
      ${ICONS[item.icon]}<span>${item.label}</span>
      ${count!=null && count>0 ? `<span class="count">${count}</span>` : ''}
    </button>`;
  }).join('');
  document.getElementById('settingsNavBtn').classList.toggle('active', state.page==='settings');

  document.getElementById('bottomNav').innerHTML = BOTTOM_NAV_IDS.map(id => {
    const item = NAV_ITEMS.find(n=>n.id===id);
    const active = state.page === id;
    return `<button class="${active?'active':''}" onclick="navigate('${id}')">${ICONS[item.icon]}<span>${item.label}</span></button>`;
  }).join('') + `<button class="${state.page==='more'?'active':''}" onclick="toggleSidebar()">${ICONS.more}<span>More</span></button>`;
}

function navigate(page){
  state.page = page;
  state.filters = {};
  closeAllOverlays();
  window.scrollTo(0,0);
  document.getElementById('page').scrollTop = 0;
  renderNav();
  renderPage();
  window.location.hash = page;
}

function renderPage(){
  const el = document.getElementById('page');
  const renderers = {
    dashboard: renderDashboard, fleet: renderFleet, rentals: renderRentals,
    reservations: renderReservations, customers: renderCustomers, sunpass: renderSunpass,
    payments: renderPayments, maintenance: renderMaintenance, settings: renderSettings,
  };
  el.innerHTML = (renderers[state.page] || renderDashboard)();
}

/* ---- overlays: sidebar / dropdowns / drawer / modal / toast ---- */
function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('scrim').classList.toggle('show');
}
function toggleDropdown(id, ev){
  ev && ev.stopPropagation();
  const el = document.getElementById(id);
  const wasOpen = el.classList.contains('show');
  document.querySelectorAll('.dropdown.show').forEach(d=>d.classList.remove('show'));
  if(!wasOpen) el.classList.add('show');
}
document.addEventListener('click', (e)=>{
  if(!e.target.closest('.dropdown') && !e.target.closest('.nav-user') && !e.target.closest('.topbar-avatar')){
    document.querySelectorAll('.dropdown.show').forEach(d=>d.classList.remove('show'));
  }
});
function closeAllOverlays(){
  document.getElementById('sidebar').classList.remove('open');
  document.querySelectorAll('.dropdown.show').forEach(d=>d.classList.remove('show'));
  closeDrawer();
  closeModal();
  document.getElementById('scrim').classList.remove('show');
}
function toast(msg, icon){
  const root = document.getElementById('toast-root');
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `${ICONS[icon||'check']}<span>${esc(msg)}</span>`;
  root.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .25s'; setTimeout(()=>t.remove(), 260); }, 2600);
}
function toggleTheme(){
  const root = document.documentElement;
  if(state.theme === 'system'){ state.theme='dark'; root.setAttribute('data-theme','dark'); toast('Dark theme enabled'); }
  else if(state.theme === 'dark'){ state.theme='light'; root.setAttribute('data-theme','light'); toast('Light theme enabled'); }
  else { state.theme='system'; root.removeAttribute('data-theme'); toast('Following system theme'); }
}

function openDrawer(html, wide){
  const layer = document.getElementById('drawer-layer');
  layer.innerHTML = `<div class="drawer${wide?' wide':''}" id="activeDrawer">${html}</div>`;
  document.getElementById('scrim').classList.add('show');
  requestAnimationFrame(()=> document.getElementById('activeDrawer').classList.add('show'));
}
function closeDrawer(){
  const d = document.getElementById('activeDrawer');
  if(d){ d.classList.remove('show'); }
  if(!document.querySelector('.modal-wrap')) document.getElementById('scrim').classList.remove('show');
  setTimeout(()=>{ const layer = document.getElementById('drawer-layer'); if(layer && !layer.querySelector('.drawer.show')) layer.innerHTML=''; }, 220);
}
function openModal(html){
  const layer = document.getElementById('modal-layer');
  layer.innerHTML = `<div class="modal-wrap" id="activeModal" onclick="if(event.target.id==='activeModal')closeModal()"><div class="modal">${html}</div></div>`;
  document.getElementById('scrim').classList.add('show');
  requestAnimationFrame(()=> document.getElementById('activeModal').classList.add('show'));
}
function closeModal(){
  const m = document.getElementById('activeModal');
  if(m) m.classList.remove('show');
  if(!document.querySelector('.drawer.show')) document.getElementById('scrim').classList.remove('show');
  setTimeout(()=>{ const layer = document.getElementById('modal-layer'); if(layer) layer.innerHTML=''; }, 180);
}

function renderAlertsDropdown(){
  const alerts = buildAlerts();
  document.getElementById('alertsCountLbl').textContent = alerts.length ? `${alerts.length} need attention` : 'All clear';
  document.getElementById('alertsDot').style.display = alerts.length ? 'block' : 'none';
  document.getElementById('alertsDropdownBody').innerHTML = alerts.length ? alerts.map(a => `
    <div class="alert-item" style="cursor:pointer; padding:11px 16px;" onclick="${a.onclick}">
      <div class="alert-dot ${a.tone}">${ICONS[a.icon]}</div>
      <div class="alert-text"><b>${esc(a.title)}</b><span>${esc(a.sub)}</span></div>
    </div>`).join('') : `<div class="empty-mini">No alerts right now — smooth sailing.</div>`;
}
</script>
<script>
/* =========================================================================
   ALERTS (shared by dashboard panel + header bell dropdown)
   ========================================================================= */
function buildAlerts(){
  const alerts = [];
  DATA.maintenance.filter(m=>m.status==='Overdue').forEach(m=>{
    const v = vehicleById(m.vehicle);
    alerts.push({tone:'danger', icon:'wrench', title:`${vehicleLabel(v)} — maintenance overdue`, sub:`${m.type} was due ${fmtDate(m.dueDate)}`, onclick:`navigate('maintenance')`});
  });
  DATA.rentals.filter(r=>r.status==='Late').forEach(r=>{
    const v = vehicleById(r.vehicle), c = customerById(r.customer);
    alerts.push({tone:'danger', icon:'clock', title:`${c.name} — return overdue`, sub:`${vehicleLabel(v)} was due back ${fmtDate(r.dropoff)}`, onclick:`navigate('rentals')`});
  });
  DATA.payments.filter(p=>p.status==='Overdue').forEach(p=>{
    const c = customerById(p.customer);
    alerts.push({tone:'danger', icon:'wallet', title:`${c.name} — payment overdue`, sub:`${fmtMoney(p.amount)} past due since ${fmtDate(p.date)}`, onclick:`navigate('payments')`});
  });
  const pendingToll = DATA.sunpass.filter(t=>t.status==='Pending');
  if(pendingToll.length){
    const sum = pendingToll.reduce((s,t)=>s+t.amount,0);
    alerts.push({tone:'toll', icon:'sunpass', title:`SunPass — ${pendingToll.length} unpaid toll${pendingToll.length>1?'s':''}`, sub:`${fmtMoney(sum)} pending collection from customers`, onclick:`navigate('sunpass')`});
  }
  DATA.customers.filter(c=>c.docStatus==='Pending').forEach(c=>{
    alerts.push({tone:'warn', icon:'doc', title:`${c.name} — document pending`, sub:`Driver's license verification incomplete`, onclick:`navigate('customers')`});
  });
  DATA.maintenance.filter(m=>m.status==='Due Soon').forEach(m=>{
    const v = vehicleById(m.vehicle);
    alerts.push({tone:'warn', icon:'wrench', title:`${vehicleLabel(v)} — service due soon`, sub:`${m.type} scheduled for ${fmtDate(m.dueDate)}`, onclick:`navigate('maintenance')`});
  });
  return alerts;
}

/* =========================================================================
   DASHBOARD
   ========================================================================= */
function renderDashboard(){
  const vehicles = DATA.vehicles;
  const total = vehicles.length;
  const available = vehicles.filter(v=>v.status==='Available').length;
  const rented = vehicles.filter(v=>v.status==='Rented').length;
  const reserved = vehicles.filter(v=>v.status==='Reserved').length;
  const maint = vehicles.filter(v=>v.status==='Maintenance').length;

  const activeRentals = DATA.rentals.filter(r=>r.status==='Active'||r.status==='Late');
  const monthRevenue = DATA.rentals.filter(r=>['Active','Late','Completed'].includes(r.status) && r.pickup.slice(0,7)==='2026-09' || r.dropoff.slice(0,7)==='2026-09').reduce((s,r)=>s+rentalTotal(r),0);
  const pendingPayments = DATA.payments.filter(p=>p.status==='Pending'||p.status==='Overdue').reduce((s,p)=>s+p.amount,0);
  const sunpassPending = DATA.sunpass.filter(t=>t.status==='Pending').reduce((s,t)=>s+t.amount,0);

  const returnsToday = DATA.rentals.filter(r=>r.dropoff===isoToday() && (r.status==='Active'||r.status==='Late'));
  const pickupsToday = DATA.reservations.filter(r=>r.pickup===isoToday() && r.status==='Confirmed');
  const startingToday = DATA.reservations.filter(r=>r.pickup===isoToday() && (r.status==='Confirmed'||r.status==='Pending'));

  const alerts = buildAlerts();

  function activityRow(kind, r){
    const v = vehicleById(r.vehicle), c = customerById(r.customer);
    const map = {
      return:{cls:'return', icon:'car', verb:'Return', time:r.dropoffTime||'—', date:r.dropoff},
      pickup:{cls:'pickup', icon:'car', verb:'Pickup', time:r.pickupTime||'—', date:r.pickup},
      resv:{cls:'resv', icon:'reservations', verb:r.status==='Pending'?'Requested':'Confirmed', time:r.pickupTime||'—', date:r.pickup},
    }[kind];
    return `<div class="activity-item" onclick="${kind==='return'?`openRentalDrawer('${r.id}')`:`openReservationDrawer('${r.id}')`}" style="cursor:pointer;">
      <div class="activity-thumb ${map.cls}">${ICONS[map.icon]}</div>
      <div class="activity-text"><b>${esc(c.name)}</b><span>${esc(vehicleLabel(v))}</span></div>
      <div class="activity-time">${map.verb}: ${fmtDateShort(map.date)}<small>${esc(map.time)}</small></div>
    </div>`;
  }

  return `
    <div class="page-head">
      <div><h1>Dashboard</h1><p class="sub">Here's what's happening across the fleet today, ${fmtDate(isoToday())}.</p></div>
      <div class="page-actions">
        <button class="btn" onclick="navigate('fleet')">${ICONS.fleet} View fleet</button>
        <button class="btn btn-primary" onclick="navigate('reservations')">${ICONS.plus} New reservation</button>
      </div>
    </div>

    <div class="grid-metrics">
      <div class="metric-card accent-accent">
        <div class="metric-top"><span class="metric-label">Total Vehicles</span><div class="metric-icon">${ICONS.fleet}</div></div>
        <div class="metric-value num">${total}</div>
        <div class="metric-foot">Across ${new Set(vehicles.map(v=>v.category)).size} categories</div>
      </div>
      <div class="metric-card accent-ok">
        <div class="metric-top"><span class="metric-label">Available</span><div class="metric-icon">${ICONS.checkCircle}</div></div>
        <div class="metric-value num">${available}</div>
        <div class="metric-foot">Ready for pickup today</div>
      </div>
      <div class="metric-card accent-info">
        <div class="metric-top"><span class="metric-label">Rented</span><div class="metric-icon">${ICONS.car}</div></div>
        <div class="metric-value num">${rented}</div>
        <div class="metric-foot">${activeRentals.filter(r=>r.status==='Late').length} returning late</div>
      </div>
      <div class="metric-card accent-warn">
        <div class="metric-top"><span class="metric-label">Reserved</span><div class="metric-icon">${ICONS.reservations}</div></div>
        <div class="metric-value num">${reserved}</div>
        <div class="metric-foot">Upcoming pickups this week</div>
      </div>
      <div class="metric-card accent-danger">
        <div class="metric-top"><span class="metric-label">In Maintenance</span><div class="metric-icon">${ICONS.wrench}</div></div>
        <div class="metric-value num">${maint}</div>
        <div class="metric-foot">${DATA.maintenance.filter(m=>m.status==='Overdue').length} overdue service</div>
      </div>
    </div>

    <div class="grid-metrics gm-4">
      <div class="metric-card accent-accent">
        <div class="metric-top"><span class="metric-label">Est. Revenue (Sep)</span><div class="metric-icon">${ICONS.wallet}</div></div>
        <div class="metric-value num">${fmtMoneyShort(monthRevenue)}</div>
        <div class="metric-foot">From ${activeRentals.length} active + completed rentals</div>
      </div>
      <div class="metric-card accent-warn">

<script>

function rentalsFilteredList(){
  const q = (document.getElementById('rentalSearch')?.value||'').toLowerCase().trim();

  const when = document.getElementById('rentalWhen')?.value || 'all';
  return DATA.rentals.filter(r=>{
    const v = vehicleById(r.vehicle), c = customerById(r.customer);

    if(q && !(`${c.name} ${v.make} ${v.model} ${v.plate}`.toLowerCase().includes(q))) return false;
    if(when==='today' && r.pickup!==isoToday() && r.dropoff!==isoToday()) return false;
    if(when==='week' && (daysFromToday(r.dropoff) < -60 && daysFromToday(r.pickup) < -60)) return false;
    return true;
  }).sort((a,b)=>{
    const order = {Late:0, Active:1, Upcoming:2, Completed:3, Cancelled:4};
    const diff = (order[a.status]??9) - (order[b.status]??9);
    if(diff!==0) return diff;
    return parseISO(a.dropoff)-parseISO(b.dropoff);
  });
}
function applyRentalFilters(){
  const list = rentalsFilteredList();
  document.getElementById('rentalCount').textContent = `${list.length} rental${list.length!==1?'s':''}`;

function openConvertModal(id){
  const r = api.getReservation(id), v = vehicleById(r.vehicle), c = customerById(r.customer);

  openModal(`

function confirmConvert(id){
  const r = api.getReservation(id), v = vehicleById(r.vehicle);

  const newRental = {id:'R'+String(DATA.rentals.length+1).padStart(2,'0'), vehicle:r.vehicle, customer:r.customer, pickup:r.pickup, dropoffTime:null, dropoff:r.dropoff, dailyRate:v.dailyRate, extras:0, sunpass:0, deposit:200, status:'Active', payment:'Pending'};

function confirmAssign(txId){

          </div>`).join('') : `<div class="empty-mini">No payments recorded for this rental yet.</div>`}

function markReturned(id){
  const r = api.getRental(id), v = vehicleById(r.vehicle);

  v.status = 'Available'; v.currentCustomer = null; v.currentRental = null;
  closeDrawer();
  toast('Vehicle marked as returned and now available.');
  renderNav();
  renderPage();
}

function openCustomerDrawer(id){
  const c = customerById(id);
  const rentals = DATA.rentals.filter(r=>r.customer===id).sort((a,b)=>parseISO(b.pickup)-parseISO(a.pickup));
  const pays = DATA.payments.filter(p=>p.customer===id).sort((a,b)=>parseISO(b.date)-parseISO(a.date));
  const tolls = DATA.sunpass.filter(t=>t.customer===id).sort((a,b)=>parseISO(b.date)-parseISO(a.date));
  const head = `<div><h2>${esc(c.name)}</h2><div class="sub">${badge(c.status)} ${c.docStatus==='Pending'?badge('Pending','Docs pending'):''}</div></div>`;
  const body = `
    <div class="dsection">
      <div class="dsection-title">Personal Information</div>
      <div class="kv-grid">
        <div class="kv"><label>Phone</label><b>${esc(c.phone)}</b></div>
        <div class="kv"><label>Email</label><b style="word-break:break-word;">${esc(c.email)}</b></div>
        <div class="kv" style="grid-column:1/-1;"><label>Address</label><b>${esc(c.address)}</b></div>
        <div class="kv"><label>Customer since</label><b>${fmtDate(c.joined)}</b></div>
        <div class="kv"><label>Total spent</label><b class="num">${fmtMoney(customerTotalSpent(c.id))}</b></div>

    </div>
    <div class="dsection">
      <div class="dsection-title">Documents</div>

      <div class="doc-row">${ICONS.doc}<span class="t1">License number</span><span class="mono" style="font-size:12px;color:var(--ink-600);">${esc(c.licenseNo)}</span></div>
    </div>
    <div class="dsection">
      <div class="dsection-title">Rental History (${rentals.length})</div>
      <div class="mini-list">
        ${rentals.length ? rentals.map(r=>`
          <div class="mini-row" style="cursor:pointer;" onclick="openRentalDrawer('${r.id}')">
            <div><div class="t1">${esc(vehicleLabel(vehicleById(r.vehicle)))}</div><div class="t2">${fmtDate(r.pickup)} – ${fmtDate(r.dropoff)}</div></div>
            ${badge(r.status)}
          </div>`).join('') : `<div class="empty-mini">No rentals yet.</div>`}
      </div>
    </div>
    <div class="dsection">
      <div class="dsection-title">Payment History</div>
      <div class="mini-list">
        ${pays.length ? pays.map(p=>`
          <div class="mini-row">
            <div><div class="t1">${esc(p.description)}</div><div class="t2">${fmtDate(p.date)}</div></div>
            <div style="text-align:right;"><div class="t1 num">${fmtMoney(p.amount)}</div>${badge(p.status)}</div>
          </div>`).join('') : `<div class="empty-mini">No payment history yet.</div>`}
      </div>
    </div>
    <div class="dsection">
      <div class="dsection-title">SunPass</div>
      <div class="mini-list">
        ${tolls.length ? tolls.map(t=>`
          <div class="mini-row">
            <div><div class="t1">${esc(t.location)}</div><div class="t2">${fmtDate(t.date)}</div></div>
            <div style="text-align:right;"><div class="t1 num">${fmtMoney(t.amount)}</div>${badge(t.status)}</div>
          </div>`).join('') : `<div class="empty-mini">No SunPass activity yet.</div>`}
      </div>
    </div>
    <div class="dsection">
      <div class="dsection-title">Internal Notes</div>
      <textarea id="custNotes_${c.id}" class="note-box" style="width:100%;border:1px solid var(--line);font-family:inherit;" rows="4" onblur="saveNotes('${c.id}', this.value)" placeholder="Add a private note visible only to staff…">${esc(c.notes||'')}</textarea>
    </div>
  `;
  openDrawer(drawerShell(head, body));
}
function saveNotes(id, val){
  const c = customerById(id);
  c.notes = val;
  toast('Internal note saved.');
}
</script>
<script>
/* =========================================================================
   INIT
   ========================================================================= */
const WEEKDAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
(function(){
  const _renderNav = renderNav;
  renderNav = function(){ _renderNav(); renderAlertsDropdown(); };
})();

function init(){
  document.getElementById('topbarDate').textContent = `${WEEKDAYS[TODAY.getDay()]}, ${fmtDate(isoToday())}`;
  const validPages = [...NAV_ITEMS.map(n=>n.id), 'settings'];
  const hash = window.location.hash.replace('#','');
  state.page = validPages.includes(hash) ? hash : 'dashboard';
  renderNav();
  renderPage();
}
window.addEventListener('hashchange', ()=>{
  const hash = window.location.hash.replace('#','');
  const validPages = [...NAV_ITEMS.map(n=>n.id), 'settings'];
  if(validPages.includes(hash) && hash !== state.page){
    state.page = hash;
    state.filters = {};
    renderNav();
    renderPage();
  }
});
document.addEventListener('keydown', (e)=>{ if(e.key==='Escape') closeAllOverlays(); });
init();
</script>
